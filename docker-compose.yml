services:
  pluck:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DOWNLOAD_DIR: /tmp/pluck
      # Optional: protect the app on your home network
      # APP_PASSWORD: change-me
      # S3-compatible storage (Railway bucket, MinIO, etc.)
      # S3_ENDPOINT: https://your-bucket.storage.railway.app
      # S3_REGION: auto
      # S3_BUCKET: your-bucket
      # S3_ACCESS_KEY_ID: ...
      # S3_SECRET_ACCESS_KEY: ...
      # S3_PREFIX: pluck
    volumes:
      - pluck-tmp:/tmp/pluck
    restart: unless-stopped

  # Optional local S3 for development
  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: pluck
      MINIO_ROOT_PASSWORD: pluck-secret
    volumes:
      - minio-data:/data

volumes:
  pluck-tmp:
  minio-data:
