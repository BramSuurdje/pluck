services:
  pluck:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - pluck-tmp:/tmp/pluck
    restart: unless-stopped

  # Optional local S3 for development
  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - minio-data:/data

volumes:
  pluck-tmp:
  minio-data:
